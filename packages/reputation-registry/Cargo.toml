[package]
name = "reputation-registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[features]
testutils = ["soroban-sdk/testutils"]
serde = []

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
