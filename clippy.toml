# Clippy configuration for Moistello Contracts
# See: https://rust-lang.github.io/rust-clippy/stable/index.html

# Enforce a cognitive complexity limit to keep functions readable.
cognitive-complexity-threshold = 20

# Allow up to 7 arguments before flagging too-many-arguments.
too-many-arguments-threshold = 7

# Allow up to 10 lines in a function before flagging too-many-lines.
too-many-lines-threshold = 100

# Disallow large stack values. Soroban contracts run in constrained
# environments; keep stack allocations small.
large-stack-arrays-threshold = 512
vec-box-size-threshold = 4096
