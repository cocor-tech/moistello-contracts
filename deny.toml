# cargo-deny configuration for Moistello Contracts
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "wasm32-unknown-unknown" },
    { triple = "x86_64-unknown-linux-gnu" },
]

# ── Advisories ────────────────────────────────────────────────────────────────
# Reject any crate with a known security advisory.
[advisories]
version = 2
# No explicit db-path — cargo-deny uses the default location.  Setting a custom
# db-path (e.g. ~/.cargo/advisory-db) requires the runner to manage it, which
# is fragile in CI.
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

# ── Licenses ──────────────────────────────────────────────────────────────────
# Only allow OSI-approved permissive licenses.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
]
deny = []
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8
exceptions = []

# ── Bans ──────────────────────────────────────────────────────────────────────
# Prevent duplicate versions of the same crate (unless explicitly allowed).
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ── Sources ───────────────────────────────────────────────────────────────────
# Only allow dependencies from crates.io (no git or local path deps in prod).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
