[workspace]
resolver = "2"
members = [
    "packages/common",
    "packages/circle-factory",
    "packages/circle",
    "packages/reputation-registry",
    "packages/treasury",
    "packages/escrow-swap",
    "packages/staking",
    "packages/governance",
    "packages/governance-token",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.dependencies]
soroban-sdk = "26.0.0"
soroban-token-sdk = "26.0.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
