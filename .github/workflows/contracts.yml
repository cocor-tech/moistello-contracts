name: Contracts CI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/contracts.yml'

env:
  SOROBAN_CLI_VERSION: 28.1.0

jobs:
  test:
    name: Test Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache Soroban CLI
        # Dedicated cache keyed only on CLI version + features so the binary
        # survives Cargo.lock changes that invalidate rust-cache.
        id: soroban-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.soroban-cli
          key: soroban-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SOROBAN_CLI_VERSION }}-opt

      - name: Install Soroban CLI
        # soroban-cli 28.1.0 requires rustc >= 1.93.0 (aligned with rust-toolchain.toml)
        if: steps.soroban-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked soroban-cli --version "$SOROBAN_CLI_VERSION" --features opt --root ~/.soroban-cli

      - name: Add Soroban CLI to PATH
        run: |
          echo "$HOME/.soroban-cli/bin" >> "$GITHUB_PATH"
          "$HOME/.soroban-cli/bin/soroban" --version

      - name: Build contracts
        run: cargo build --target wasm32v1-none --release

      - name: Stage factory test WASM
        # circle-factory tests upload a circle contract WASM via
        # include_bytes!("../test_wasm/contract.wasm") (gitignored). It must
        # be the *optimized* build: the raw release binary (~144KB) exceeds
        # the test host's write-bytes limit and fails every factory test.
        run: |
          soroban contract optimize --wasm target/wasm32v1-none/release/circle.wasm
          mkdir -p packages/circle-factory/test_wasm
          cp target/wasm32v1-none/release/circle.optimized.wasm packages/circle-factory/test_wasm/contract.wasm

      - name: Run tests
        run: cargo test --workspace
